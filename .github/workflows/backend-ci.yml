name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: homeplatform
          POSTGRES_USER: homeplatform
          POSTGRES_PASSWORD: homeplatform-dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homeplatform -d homeplatform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__Database: Host=localhost;Port=5432;Database=homeplatform;Username=homeplatform;Password=homeplatform-dev
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore backend/HomePlatform.slnx

      - name: Audit dependencies
        run: dotnet list backend/HomePlatform.slnx package --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build backend/HomePlatform.slnx --no-restore --disable-build-servers -m:1

      - name: Test
        run: dotnet test backend/HomePlatform.slnx --no-build --disable-build-servers -m:1

      - name: Verify formatting
        run: dotnet format backend/HomePlatform.slnx --verify-no-changes --no-restore

      - name: Apply migrations from zero
        run: >
          dotnet tool run dotnet-ef database update
          --project backend/src/HomePlatform.Infrastructure/HomePlatform.Infrastructure.csproj
          --startup-project backend/src/HomePlatform.Api/HomePlatform.Api.csproj

      - name: Verify EF model matches migrations
        run: >
          dotnet tool run dotnet-ef migrations has-pending-model-changes
          --project backend/src/HomePlatform.Infrastructure/HomePlatform.Infrastructure.csproj
          --startup-project backend/src/HomePlatform.Api/HomePlatform.Api.csproj
